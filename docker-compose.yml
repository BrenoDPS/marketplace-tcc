services:
  postgres:
    image: postgres:16
    container_name: olist-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: olist
    ports:
      # 5433 externo evita conflito com Postgres nativo (Windows) na 5432.
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d olist"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: olist-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    # Sem volume de proposito: o cache e efemero por definicao, e o ensaio
    # "frio" comeca com FLUSHALL. Persistir o cache so criaria uma quarta
    # condicao nao declarada na metodologia.
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
